<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="50%" stop-color="#4ECDC4"/>
      <stop offset="100%" stop-color="#45B7D1"/>
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF5F5"/>
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGradient)"/>
  
  <!-- Decorative border -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.3"/>
  
  <!-- ABC Text -->
  <text x="50" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="url(#textGradient)">ABC</text>
  
  <!-- Learning text -->
  <text x="50" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="500" fill="#FFFFFF" opacity="0.9">LEARNING</text>
  
  <!-- Small decorative stars -->
  <polygon points="20,25 21.5,29 26,29 22.5,32 24,36 20,33 16,36 17.5,32 14,29 18.5,29" fill="#FFE66D" opacity="0.8"/>
  <polygon points="80,70 81.2,73 85,73 82,75.5 83.2,79 80,76.5 76.8,79 78,75.5 75,73 78.8,73" fill="#FFE66D" opacity="0.8"/>
  <polygon points="75,20 76,23 79,23 76.5,25 77.5,28 75,26 72.5,28 73.5,25 71,23 74,23" fill="#FFE66D" opacity="0.6"/>
</svg>
